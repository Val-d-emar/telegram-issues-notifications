name: Issues Notifier

on:
  issues:
    types: [opened, closed, reopened, assigned]

permissions:
  contents: read

concurrency:
  group: issues-notify-${{ github.event.issue.number }}-${{ github.event.action }}-${{ github.event.assignee.login || github.run_id }}
  cancel-in-progress: false

jobs:
  notify:
    name: 📢 Issues Telegram Notifier
    runs-on: ubuntu-latest
    steps:
      - name: Send Issue Notification
        uses: Val-d-emar/telegram-issues-notifications@v1
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_GROUP_ID }}
          user_map: ${{ secrets.TELEGRAM_USER_MAP }}
          # формат секрета:
          ####################################
          # gh_nickname=telegram_nickname
          # gh_nickname1=telegram_nickname2
          # ...
          # gh_nicknameN=telegram_nicknameN
          ####################################
          # gh_nickname - логин в гитхабе
          # telegram_nickname - логин в телеграме          
          language: "ru"
